[project]
name = "autograder"
version = "0.1.0"
description = "Canvas autograder runner for Python/Marimo submissions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.38.0",
    "marimo>=0.8.0",
    "scikit-learn>=1.4.0",
    "sentence-transformers>=3.0.0",
    "transformers==4.48.3",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "ipython>=9.17.1",
    "matplotlib>=3.11.1",
    "spacy>=3.8.16",
    "datasets>=5.0.1",
    "seaborn>=0.13.2",
    "altair>=5.0.0",
    "umap-learn>=0.5.5",
    "biopython>=1.88",
    "beautifulsoup4>=4.15.0",
    "jieba>=0.42.1",
    "gdown>=6.2.0",
    "hdbscan>=0.8.44",
    "kagglehub>=1.0.2",
    "networkx>=3.6.1",
    "python-louvain>=0.16",
    "pypdf>=6.21.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pronouncing>=0.3.0",
    "textstat>=0.7.13",
    "wordfreq>=3.1.1",
    "truststore>=0.10.5",
    "ipykernel>=7.4.0",
    "en-core-web-sm",
    "vadersentiment==3.3.2",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
